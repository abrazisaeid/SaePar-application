name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  core:
    name: Core Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Display .NET SDK
        run: dotnet --version

      - name: Restore
        run: dotnet restore tests/SaeParTunnel.Core.Tests/SaeParTunnel.Core.Tests.csproj

      - name: Build
        run: dotnet build tests/SaeParTunnel.Core.Tests/SaeParTunnel.Core.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/SaeParTunnel.Core.Tests/SaeParTunnel.Core.Tests.csproj --configuration Release --no-build --verbosity normal
