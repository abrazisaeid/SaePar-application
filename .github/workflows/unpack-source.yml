name: Unpack SaePar source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-source.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and expand source archive
        shell: bash
        run: |
          cat .payload/part00.b64 \
              .payload/p01.b64 \
              .payload/p02.b64 \
              .payload/r_00.b64 \
              .payload/r_01.b64 \
              .payload/r_02.b64 \
              .payload/r_03.b64 \
              .payload/q04.b64 \
              .payload/r_05.b64 \
            | base64 -d > /tmp/saepar-source.tar.xz

          echo "f74350c907a1d172abf457058f244cdb37f263316367a4f482952e6cf989dfcd  /tmp/saepar-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/saepar-source.tar.xz -C .

          rm -f SaeParTunnel-CrossPlatform-v2.0-preview21-source.zip
          rm -rf .payload

          grep -qxF 'src/SaeParTunnel.AndroidBinding/Libraries/libXray.aar' .gitignore || \
            printf '\nsrc/SaeParTunnel.AndroidBinding/Libraries/libXray.aar\n' >> .gitignore

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand SaePar Tunnel preview21 source into repository" || exit 0
          git push
